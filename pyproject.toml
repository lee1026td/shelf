[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelf-agent"
version = "0.0.1"
description = "Local-first, TUI-first CLI research library agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "shelf" }]
keywords = ["cli", "tui", "research", "agent", "local-first", "knowledge-base"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
shelf = "shelf.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf"]

[tool.hatch.build.targets.wheel.force-include]
"src/shelf/store/schema.sql" = "shelf/store/schema.sql"
"src/shelf/skills/builtin" = "shelf/skills/builtin"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
packages = ["shelf"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
